name: JOSS paper

on:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/joss-paper.yaml"
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/joss-paper.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the JOSS draft with Inara
        run: |
          docker run --rm \
            --volume "$PWD:/data" \
            --user "$(id -u):$(id -g)" \
            --env JOURNAL=joss \
            openjournals/inara \
            -o pdf paper/paper.md

      - uses: actions/upload-artifact@v4
        with:
          name: joss-paper
          path: paper/paper.pdf
